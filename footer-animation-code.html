<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Footer animation</title>
<style>body{margin:0;background:#fff;font-family:system-ui,sans-serif}
.kf{position:relative;width:100%;line-height:0;overflow:hidden}
.kf img{display:block;width:100%;height:auto}
.kf svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.kf .flow{fill:none;stroke:#fff6b8;stroke-linecap:round;stroke-dasharray:5 11;animation:kf-flow .55s linear infinite}
.kf .ring{fill:none;stroke:#fedc78;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:kf-ring 5s ease-out infinite}
.kf .ring.r2{animation-delay:2.5s}
.kf .glow{animation:kf-glow 5s ease-in-out infinite}
.kf .grain{fill:#525d00;animation:kf-grain .8s linear infinite}
.kf .drop{fill:#f4ce21;animation:kf-drop 1.6s ease-in infinite}
.kf .wing{fill:#f6edc0;transform-box:fill-box;transform-origin:50% 100%;animation:kf-wing .12s ease-in-out infinite alternate}
.kf .bob{animation:kf-bob 3s ease-in-out infinite}
@keyframes kf-flow{to{stroke-dashoffset:-16}}
@keyframes kf-ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.75);opacity:0}}
@keyframes kf-glow{0%,100%{opacity:.25}50%{opacity:.7}}
@keyframes kf-grain{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(19px);opacity:0}}
@keyframes kf-drop{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1;transform:translateY(2px) scale(1)}100%{transform:translateY(28px) scale(1);opacity:1}}
@keyframes kf-wing{from{transform:scaleY(1)}to{transform:scaleY(.7)}}
@keyframes kf-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.kf svg{display:none}}
</style></head><body>
<!-- img ka src apni footer image ke path se badal do. <style> ka .kf wala CSS apni stylesheet me daal sakte ho. -->
<!-- ===== FOOTER ANIMATION: yahan se copy karo ===== -->
<div class="kf">
  <img src="footer.png" alt="Kolhu se sarson ka tel aur shahad banane ka chitra" width="2000" height="667">
  <svg viewBox="0 0 2000 667" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <clipPath id="kf-sky"><path d="M1180 250H1480V471L1425 466 1380 460 1335 455 1290 451 1245 446 1180 440Z"/></clipPath>
      <radialGradient id="kf-halo"><stop offset=".55" stop-color="#fedc78" stop-opacity=".55"/><stop offset="1" stop-color="#fedc78" stop-opacity="0"/></radialGradient>
    </defs>
    <!-- suraj -->
    <g clip-path="url(#kf-sky)">
      <circle class="glow" cx="1330" cy="420" r="100" fill="url(#kf-halo)"/>
      <circle class="ring" cx="1330" cy="420" r="57"/><circle class="ring r2" cx="1330" cy="420" r="57"/>
      <circle cx="1330" cy="420" r="57.5" fill="#fedc78"/>
    </g>
    <!-- tel ki dhaar (kolhu + matka) -->
    <path class="flow" stroke-width="2.6" d="M947 530C948 542 947 558 947 577"/>
    <path class="flow" stroke-width="1.5" d="M1107 511C1103 520 1102.6 536 1103.5 557" style="animation-duration:.7s"/>
    <!-- shahad ki boond -->
    <circle class="drop" cx="1646" cy="550" r="2"/>
    <circle class="drop" cx="1646" cy="550" r="1.6" style="animation-delay:-.8s"/>
    <!-- chhalni se girte daane -->
    <circle class="grain" cx="494.6" cy="580.3" r="1.2" style="animation-delay:-0.12s;animation-duration:0.62s"/><circle class="grain" cx="499.2" cy="582.8" r="1.5" style="animation-delay:-0.61s;animation-duration:0.68s"/><circle class="grain" cx="503.0" cy="580.8" r="1.1" style="animation-delay:-0.08s;animation-duration:0.68s"/><circle class="grain" cx="514.0" cy="582.5" r="1.5" style="animation-delay:-0.64s;animation-duration:0.67s"/><circle class="grain" cx="496.7" cy="581.9" r="1.4" style="animation-delay:-0.68s;animation-duration:0.91s"/><circle class="grain" cx="490.4" cy="581.8" r="1.4" style="animation-delay:-0.40s;animation-duration:0.66s"/><circle class="grain" cx="501.3" cy="580.3" r="1.6" style="animation-delay:-0.69s;animation-duration:0.79s"/><circle class="grain" cx="496.4" cy="582.7" r="1.3" style="animation-delay:-0.71s;animation-duration:0.90s"/><circle class="grain" cx="502.2" cy="581.2" r="1.4" style="animation-delay:-0.34s;animation-duration:0.66s"/><circle class="grain" cx="496.5" cy="582.4" r="1.0" style="animation-delay:-0.04s;animation-duration:0.82s"/><circle class="grain" cx="495.9" cy="581.6" r="1.3" style="animation-delay:-0.27s;animation-duration:0.95s"/><circle class="grain" cx="493.5" cy="581.2" r="1.1" style="animation-delay:-0.51s;animation-duration:0.70s"/><circle class="grain" cx="498.0" cy="582.2" r="1.2" style="animation-delay:-0.45s;animation-duration:0.92s"/><circle class="grain" cx="490.8" cy="580.2" r="1.1" style="animation-delay:-0.61s;animation-duration:0.82s"/>
    <!-- madhumakkhiyan: purani static wali dhak kar nayi udti hui -->
    <circle cx="1696" cy="476" r="12" fill="#16532c"/><circle cx="1727.5" cy="507" r="12" fill="#16532c"/><circle cx="1767.5" cy="508" r="9" fill="#16532c"/>
    <g><animateMotion dur="7s" begin="0s" repeatCount="indefinite" path="M1696 477c14-16 34-10 30 6s-22 26-34 14-10-8 4-20z"/>
      <g transform="scale(1)"><g class="bob">
        <g transform="rotate(-52 -1 1)"><ellipse class="wing" cx="-1" cy="-5.5" rx="2.6" ry="5.6"/></g>
        <g transform="rotate(34 1 1)"><ellipse class="wing" cx="1" cy="-6" rx="2.8" ry="6.2"/></g>
        <circle cx="-3" cy="2.2" r="3.1" fill="#f0a31c"/><circle cx="3.4" cy="2.4" r="3.1" fill="#f0a31c"/>
        <circle cx="0.2" cy="2.3" r="1.6" fill="#c9861a"/>
      </g></g></g>
    <g><animateMotion dur="9s" begin="-3s" repeatCount="indefinite" path="M1727 508c-16-8-30 4-22 16s30 6 40-6 14-24 2-24-8 18-20 14z"/>
      <g transform="scale(1)"><g class="bob">
        <g transform="rotate(-52 -1 1)"><ellipse class="wing" cx="-1" cy="-5.5" rx="2.6" ry="5.6"/></g>
        <g transform="rotate(34 1 1)"><ellipse class="wing" cx="1" cy="-6" rx="2.8" ry="6.2"/></g>
        <circle cx="-3" cy="2.2" r="3.1" fill="#f0a31c"/><circle cx="3.4" cy="2.4" r="3.1" fill="#f0a31c"/>
        <circle cx="0.2" cy="2.3" r="1.6" fill="#c9861a"/>
      </g></g></g>
    <g><animateMotion dur="8s" begin="-5s" repeatCount="indefinite" path="M1767 508c10-14 26-20 24-6s-18 8-30 14-26-4-14-14 12 14 20 6z"/>
      <g transform="scale(0.75)"><g class="bob">
        <g transform="rotate(-52 -1 1)"><ellipse class="wing" cx="-1" cy="-5.5" rx="2.6" ry="5.6"/></g>
        <g transform="rotate(34 1 1)"><ellipse class="wing" cx="1" cy="-6" rx="2.8" ry="6.2"/></g>
        <circle cx="-3" cy="2.2" r="3.1" fill="#f0a31c"/><circle cx="3.4" cy="2.4" r="3.1" fill="#f0a31c"/>
        <circle cx="0.2" cy="2.3" r="1.6" fill="#c9861a"/>
      </g></g></g>
  </svg>
</div>
<!-- ===== yahan tak ===== -->
</body></html>
