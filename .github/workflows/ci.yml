# Checks every push and pull request. No database, secrets or third-party calls are used here:
# typecheck, lint and the pure unit tests only. (Deploys stay manual: scripts/hostinger-build.sh.)
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm exec eslint src
      - name: Unit tests
        run: |
          pnpm test:units
          pnpm test:cart-math
